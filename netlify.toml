[build]
  publish = "public"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[images]
  remote_images = ['https://images\.unsplash\.com/.*']

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
